# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Home
name: Urs Reupke
email: ursreupke@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Facts and speculation about and by Urs.
baseurl: "/" # the subpath of your site, e.g. /blog
url: "https://reupke.online" # the base hostname & protocol for your site, e.g. http://example.com
github_username:  urskr
linkedin_username: urs-reupke
# youtube_username: UrsReupke

remote_theme: "mmistakes/minimal-mistakes@4.27.1"
plugins:
  - jekyll-feed
  - jekyll-include-cache

site-locale: de-DE
search: true
lunr:
  search_within_pages: true

include: ["_pages"]

footer:
  links:
    - label: "Impressum"
      icon: "fa-solid fa-file-contract"
      url: "/impressum"
#    - label: "Datenschutz"
#      icon: "fa-solid fa-shield"
#      url: "/ds"

defaults:
  - 
    scope:
      path: ""
      type: posts
    values:
      layout: single
      author: "Urs"
      author_profile: true
      tagline: "" #else posts show their first line as tagline
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
      author: "Urs"

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
